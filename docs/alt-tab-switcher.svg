<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">GlassBar Alt Tab switcher</title>
  <desc id="desc">A horizontal glass switcher with animated application preview cards and close buttons.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26394a" stop-opacity=".96"/>
      <stop offset="1" stop-color="#101923" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064e3b"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".65"/></filter>
  </defs>
  <rect width="1440" height="360" fill="#07101a"/>
  <circle cx="160" cy="36" r="220" fill="#38bdf8" opacity=".08"/>
  <circle cx="1310" cy="334" r="270" fill="#a78bfa" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="42" y="42" width="1356" height="276" rx="28" fill="url(#glass)" stroke="#9adfff" stroke-opacity=".25"/>
  </g>

